name: "English (Recommended)"
description: "Report a bug, suggest an improvement, or ask a question."
body:
  - type: checkboxes
    id: scope
    attributes:
      label: "Before you submit"
      description: "Ketch is a general-purpose download manager, not a downloader for specific sites. Requests to support a particular video or social media site, or to bypass DRM, will be closed. Please only download content you have the right to."
      options:
        - label: "This isn't a request to support a specific video or social media site, or to bypass DRM."
          required: true
  - type: dropdown
    id: type
    attributes:
      label: "Issue type"
      options:
        - "Bug report"
        - "Feature request"
        - "Question"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "What happened, what did you expect, or what would you like to see? For a bug, list the steps to reproduce it."
      placeholder: "Describe the issue.\n\nSteps to reproduce:\n1. ...\n2. ..."
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: "Platform"
      description: "Select all that apply."
      multiple: true
      options:
        - "Not platform-specific"
        - "Windows"
        - "macOS"
        - "Linux"
        - "Android"
        - "iOS"
        - "Web app"
        - "Browser extension"
        - "CLI"
        - "Docker"
        - "Library (SDK)"
        - "Other"
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: "Ketch version"
      description: "Shown in Settings → About."
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Collect logs from **Settings → About → Troubleshooting**:
        - **Desktop:** Select **Open log folder**.
        - **Android or iOS:** Select **Share logs**.
        - **Web:** Open your browser's developer console.
        - **CLI:** Copy the relevant terminal output.
        See the [logging guide](https://github.com/linroid/Ketch/blob/main/docs/logging.md) for details.
  - type: textarea
    id: logs
    attributes:
      label: "Logs"
      description: "Paste relevant excerpts here, or attach log files in a comment after submitting. Remove sensitive information before sharing."
      placeholder: "Paste relevant log excerpts here."
    validations:
      required: false

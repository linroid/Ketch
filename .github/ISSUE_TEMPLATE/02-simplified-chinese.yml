name: "简体中文"
description: "报告问题、提出改进建议或提问。"
body:
  - type: checkboxes
    id: scope
    attributes:
      label: "提交前须知"
      description: "Ketch 是通用下载工具，不针对特定网站做适配。要求支持某个视频网站或社交平台、或破解 DRM 的 issue 会被直接关闭。请仅下载你有权下载的内容。"
      options:
        - label: "我确认本 issue 不涉及适配特定视频网站或社交平台，也不涉及破解 DRM。"
          required: true
  - type: dropdown
    id: type
    attributes:
      label: "问题类型"
      options:
        - "问题报告"
        - "功能建议"
        - "提问"
        - "其他"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "问题描述"
      description: "请描述实际情况、预期结果或你希望新增的功能。如果是问题报告，请附上复现步骤。"
      placeholder: "请描述问题。\n\n复现步骤：\n1. ...\n2. ..."
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: "平台"
      description: "可多选。"
      multiple: true
      options:
        - "与平台无关"
        - "Windows"
        - "macOS"
        - "Linux"
        - "Android"
        - "iOS"
        - "Web 版"
        - "浏览器扩展"
        - "CLI"
        - "Docker"
        - "库（SDK）"
        - "其他"
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: "Ketch 版本"
      description: "可在 设置 → 关于 中查看。"
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        可在应用的 **设置 → 关于 → 故障排查** 中收集日志：
        - **桌面版：** 点击 **打开日志文件夹**。
        - **Android 或 iOS：** 点击 **分享日志**。
        - **Web 版：** 打开浏览器的开发者控制台。
        - **CLI：** 复制相关的终端输出。
        详情请参阅[日志说明](https://github.com/linroid/Ketch/blob/main/docs/logging.md)。
  - type: textarea
    id: logs
    attributes:
      label: "日志"
      description: "请在此粘贴相关日志片段，或在提交 issue 后通过评论附上日志文件。分享前请删除敏感信息。"
      placeholder: "请粘贴相关日志片段。"
    validations:
      required: false

name: "Español"
description: "Informa de errores, sugiere mejoras o haz preguntas."
body:
  - type: checkboxes
    id: scope
    attributes:
      label: "Antes de enviar"
      description: "Ketch es un gestor de descargas de uso general, no un descargador para sitios concretos. Cerraremos las solicitudes para dar soporte a un sitio de vídeo o red social en particular, o para eludir el DRM. Descarga solo contenido que tengas derecho a descargar."
      options:
        - label: "Confirmo que no estoy pidiendo soporte para un sitio de vídeo o red social concreto, ni una forma de eludir el DRM."
          required: true
  - type: dropdown
    id: type
    attributes:
      label: "Tipo de issue"
      options:
        - "Informe de error"
        - "Solicitud de función"
        - "Pregunta"
        - "Otro"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Descripción"
      description: "¿Qué ocurrió, qué esperabas o qué te gustaría ver?"
      placeholder: "Describe el problema y cualquier contexto relevante."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Pasos para reproducir"
      description: "En los informes de errores, indica los pasos para reproducir el problema."
      placeholder: "1. ...\n2. ..."
  - type: textarea
    id: environment
    attributes:
      label: "Entorno"
      description: "Indica la versión de Ketch y la plataforma cuando sea relevante."
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Recopila los registros desde **Ajustes → Acerca de → Solución de problemas**:
        - **Escritorio:** Selecciona **Abrir carpeta de registros**.
        - **Android o iOS:** Selecciona **Compartir registros**.
        - **Web:** Abre la consola de desarrollador de tu navegador.
        - **CLI:** Copia la salida relevante de la terminal.
        Consulta la [guía de registros](https://github.com/linroid/Ketch/blob/main/docs/logging.md) para más detalles.
  - type: textarea
    id: logs
    attributes:
      label: "Registros"
      description: "Pega aquí fragmentos relevantes o adjunta los archivos en un comentario después de enviar el issue. Elimina los datos sensibles antes de compartirlos."
      placeholder: "Pega aquí fragmentos relevantes de los registros."
    validations:
      required: false

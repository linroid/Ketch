name: "日本語"
description: "バグ報告、改善案、質問を送信します。"
body:
  - type: checkboxes
    id: scope
    attributes:
      label: "送信前の確認"
      description: "Ketch は汎用のダウンロードマネージャーで、特定のサイト向けの機能は提供していません。特定の動画サイトや SNS への対応、DRM の回避を求める Issue はクローズします。ダウンロードは、権利のあるコンテンツに限ってください。"
      options:
        - label: "特定の動画サイトや SNS への対応、または DRM の回避を求める内容ではありません。"
          required: true
  - type: dropdown
    id: type
    attributes:
      label: "Issue の種類"
      options:
        - "バグ報告"
        - "機能リクエスト"
        - "質問"
        - "その他"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "説明"
      description: "発生したこと、期待した動作、または追加してほしい内容を記入してください。バグの場合は再現手順も記入してください。"
      placeholder: "問題の内容を記入してください。\n\n再現手順:\n1. ...\n2. ..."
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: "プラットフォーム"
      description: "該当するものをすべて選択してください。"
      multiple: true
      options:
        - "プラットフォームに依存しない"
        - "Windows"
        - "macOS"
        - "Linux"
        - "Android"
        - "iOS"
        - "Web アプリ"
        - "ブラウザー拡張機能"
        - "CLI"
        - "Docker"
        - "ライブラリ（SDK）"
        - "その他"
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: "Ketch のバージョン"
      description: "設定 → アプリについて で確認できます。"
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ログは **設定 → アプリについて → トラブルシューティング** から取得できます。
        - **デスクトップ:** **ログフォルダーを開く** を選択します。
        - **Android / iOS:** **ログを共有** を選択します。
        - **Web:** ブラウザーの開発者コンソールを開きます。
        - **CLI:** 関連するターミナル出力をコピーします。
        詳しくは[ログガイド](https://github.com/linroid/Ketch/blob/main/docs/logging.md)を参照してください。
  - type: textarea
    id: logs
    attributes:
      label: "ログ"
      description: "関連するログの抜粋を貼り付けるか、Issue の送信後にコメントでログファイルを添付してください。共有前に機密情報を削除してください。"
      placeholder: "関連するログの抜粋を貼り付けてください。"
    validations:
      required: false

name: "Deutsch"
description: "Melde Fehler, schlage Verbesserungen vor oder stelle Fragen."
body:
  - type: checkboxes
    id: scope
    attributes:
      label: "Vor dem Absenden"
      description: "Ketch ist ein universeller Download-Manager und kein Downloader für bestimmte Websites. Anfragen zur Unterstützung einzelner Video- oder Social-Media-Plattformen oder zum Umgehen von DRM werden geschlossen. Lade nur Inhalte herunter, die du herunterladen darfst."
      options:
        - label: "Ich bestätige, dass es hier nicht um die Unterstützung einer bestimmten Video- oder Social-Media-Plattform oder um das Umgehen von DRM geht."
          required: true
  - type: dropdown
    id: type
    attributes:
      label: "Art des Problems"
      options:
        - "Fehlerbericht"
        - "Funktionswunsch"
        - "Frage"
        - "Sonstiges"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Beschreibung"
      description: "Was ist passiert, was hast du erwartet oder was möchtest du sehen?"
      placeholder: "Beschreibe das Problem mit relevantem Kontext."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Schritte zur Reproduktion"
      description: "Gib bei Fehlerberichten die Schritte an, mit denen sich das Problem reproduzieren lässt."
      placeholder: "1. ...\n2. ..."
  - type: textarea
    id: environment
    attributes:
      label: "Umgebung"
      description: "Gib bei Bedarf deine Ketch-Version und Plattform an."
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        So sammelst du Protokolle über **Einstellungen → Über → Fehlerbehebung**:
        - **Desktop:** Wähle **Protokollordner öffnen**.
        - **Android oder iOS:** Wähle **Protokolle teilen**.
        - **Web:** Öffne die Entwicklerkonsole deines Browsers.
        - **CLI:** Kopiere die relevante Terminalausgabe.
        Weitere Informationen findest du in der [Logging-Anleitung](https://github.com/linroid/Ketch/blob/main/docs/logging.md).
  - type: textarea
    id: logs
    attributes:
      label: "Protokolle"
      description: "Füge relevante Auszüge hier ein oder hänge Protokolldateien nach dem Absenden in einem Kommentar an. Entferne vertrauliche Informationen vor dem Teilen."
      placeholder: "Füge relevante Protokollauszüge hier ein."
    validations:
      required: false

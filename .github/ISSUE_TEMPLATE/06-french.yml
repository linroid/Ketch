name: "Français"
description: "Signalez un bug, suggérez une amélioration ou posez une question."
body:
  - type: checkboxes
    id: scope
    attributes:
      label: "Avant d’envoyer"
      description: "Ketch est un gestionnaire de téléchargement généraliste, pas un outil dédié à des sites particuliers. Les demandes de prise en charge d’un site de vidéo ou d’un réseau social précis, ou de contournement des DRM, seront fermées. Ne téléchargez que des contenus que vous avez le droit de télécharger."
      options:
        - label: "Je confirme qu’il ne s’agit pas d’une demande de prise en charge d’un site de vidéo ou d’un réseau social précis, ni de contournement des DRM."
          required: true
  - type: dropdown
    id: type
    attributes:
      label: "Type d’issue"
      options:
        - "Rapport de bug"
        - "Demande de fonctionnalité"
        - "Question"
        - "Autre"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "Que s’est-il passé, à quoi vous attendiez-vous ou que souhaiteriez-vous voir ?"
      placeholder: "Décrivez le problème et le contexte utile."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Étapes de reproduction"
      description: "Pour les rapports de bug, indiquez les étapes permettant de reproduire le problème."
      placeholder: "1. ...\n2. ..."
  - type: textarea
    id: environment
    attributes:
      label: "Environnement"
      description: "Indiquez la version de Ketch et la plateforme si nécessaire."
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Récupérez les journaux depuis **Paramètres → À propos → Dépannage** :
        - **Ordinateur :** choisissez **Ouvrir le dossier des journaux**.
        - **Android ou iOS :** choisissez **Partager les journaux**.
        - **Web :** ouvrez la console de développement de votre navigateur.
        - **CLI :** copiez la sortie pertinente du terminal.
        Consultez le [guide des journaux](https://github.com/linroid/Ketch/blob/main/docs/logging.md) pour plus de détails.
  - type: textarea
    id: logs
    attributes:
      label: "Journaux"
      description: "Collez des extraits pertinents ici ou joignez les fichiers dans un commentaire après l’envoi de l’issue. Supprimez les informations sensibles avant de les partager."
      placeholder: "Collez ici des extraits pertinents des journaux."
    validations:
      required: false

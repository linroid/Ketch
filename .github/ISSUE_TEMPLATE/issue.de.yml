name: "Deutsch"
description: "Melde Fehler, schlage Verbesserungen vor oder stelle Fragen."
body:
  - type: markdown
    attributes:
      value: |
        Wenn möglich, verfasse dein Issue auf Englisch. Issues in anderen Sprachen sind ebenfalls willkommen.
  - type: dropdown
    id: type
    attributes:
      label: "Art des Problems"
      options:
        - "Fehlerbericht"
        - "Funktionswunsch"
        - "Frage"
        - "Sonstiges"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Beschreibung"
      description: "Was ist passiert, was hast du erwartet oder was möchtest du sehen?"
      placeholder: "Beschreibe das Problem mit relevantem Kontext."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Schritte zur Reproduktion"
      description: "Gib bei Fehlerberichten die Schritte an, mit denen sich das Problem reproduzieren lässt."
      placeholder: "1. ...\n2. ..."
  - type: textarea
    id: environment
    attributes:
      label: "Umgebung"
      description: "Gib bei Bedarf deine Ketch-Version und Plattform an."
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: "Protokolle"
      description: "Füge bei Fehlerberichten nach Möglichkeit relevante Protokolldateien in einem Kommentar bei oder füge Auszüge hier ein. Entferne vorher Passwörter, Zugriffstoken und andere vertrauliche Informationen."
      placeholder: "Füge relevante Protokollauszüge hier ein. Hänge Protokolldateien nach dem Absenden in einem Kommentar an."
    validations:
      required: false

name: "Français"
description: "Signalez un bug, suggérez une amélioration ou posez une question."
body:
  - type: markdown
    attributes:
      value: |
        Si possible, rédigez votre issue en anglais. Les issues dans d’autres langues sont également les bienvenues.
  - type: dropdown
    id: type
    attributes:
      label: "Type d’issue"
      options:
        - "Rapport de bug"
        - "Demande de fonctionnalité"
        - "Question"
        - "Autre"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "Que s’est-il passé, à quoi vous attendiez-vous ou que souhaiteriez-vous voir ?"
      placeholder: "Décrivez le problème et le contexte utile."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Étapes de reproduction"
      description: "Pour les rapports de bug, indiquez les étapes permettant de reproduire le problème."
      placeholder: "1. ...\n2. ..."
  - type: textarea
    id: environment
    attributes:
      label: "Environnement"
      description: "Indiquez la version de Ketch et la plateforme si nécessaire."
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: "Journaux"
      description: "Pour les rapports de bug, joignez si possible les fichiers de journal pertinents dans un commentaire ou collez des extraits ici. Supprimez d’abord les mots de passe, jetons et autres informations sensibles."
      placeholder: "Collez ici des extraits pertinents. Après l’envoi de l’issue, joignez les fichiers dans un commentaire."
    validations:
      required: false

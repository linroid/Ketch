name: "English"
description: "Report a bug, suggest an improvement, or ask a question."
body:
  - type: markdown
    attributes:
      value: |
        If possible, please write in English. Issues in other languages are also welcome.
  - type: dropdown
    id: type
    attributes:
      label: "Issue type"
      options:
        - "Bug report"
        - "Feature request"
        - "Question"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "What happened, what did you expect, or what would you like to see?"
      placeholder: "Describe the issue with any relevant context."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      description: "For bug reports, list the steps that reproduce the problem."
      placeholder: "1. ...\n2. ..."
  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: "Include your Ketch version and platform when relevant."
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: "Logs"
      description: "For bug reports, attach relevant log files in a comment if possible, or paste relevant excerpts here. Remove passwords, tokens, and other sensitive information first."
      placeholder: "Paste relevant log excerpts here. After submitting, attach log files in a comment."
    validations:
      required: false

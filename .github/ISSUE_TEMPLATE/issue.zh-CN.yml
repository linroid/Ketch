name: "简体中文"
description: "报告问题、提出改进建议或提问。"
body:
  - type: markdown
    attributes:
      value: |
        如果方便，请尽量使用英文；也欢迎使用其他语言提交 issue。
  - type: dropdown
    id: type
    attributes:
      label: "问题类型"
      options
        - "问题报告"
        - "功能建议"
        - "提问"
        - "其他"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "问题描述"
      description: "请描述实际情况、预期结果或你希望新增的功能。"
      placeholder: "请描述问题及相关背景。"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "复现步骤"
      description: "如果是问题报告，请列出复现问题的步骤。"
      placeholder: "1. ...\n2. ..."
  - type: textarea
    id: environment
    attributes:
      label: "运行环境"
      description: "如有需要，请提供 Ketch 版本和平台信息。"
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        可在应用的 **设置 → 关于 → 故障排查** 中收集日志：
        - **桌面版：** 点击 **打开日志文件夹**。
        - **Android 或 iOS：** 点击 **分享日志**。
        - **Web 版：** 打开浏览器的开发者控制台。
        - **CLI：** 复制相关的终端输出。
        详情请参阅[日志说明](https://github.com/linroid/Ketch/blob/main/docs/logging.md)。
  - type: textarea
    id: logs
    attributes:
      label: "日志"
      description: "请在此粘贴相关日志片段，或在提交 issue 后通过评论附上日志文件。分享前请删除敏感信息。"
      placeholder: "请粘贴相关日志片段。"
    validations:
      required: false

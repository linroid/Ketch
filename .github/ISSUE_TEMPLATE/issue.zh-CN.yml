name: "简体中文"
description: "报告问题、提出改进建议或提问。"
body:
  - type: markdown
    attributes:
      value: |
        如果方便，请尽量使用英文；也欢迎使用其他语言提交 issue。
  - type: dropdown
    id: type
    attributes:
      label: "问题类型"
      options:
        - "问题报告"
        - "功能建议"
        - "提问"
        - "其他"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "问题描述"
      description: "请描述实际情况、预期结果或你希望新增的功能。"
      placeholder: "请描述问题及相关背景。"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "复现步骤"
      description: "如果是问题报告，请列出复现问题的步骤。"
      placeholder: "1. ...\n2. ..."
  - type: textarea
    id: environment
    attributes:
      label: "运行环境"
      description: "如有需要，请提供 Ketch 版本和平台信息。"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: "日志"
      description: "如果是问题报告，请尽量在 issue 评论中附上相关日志文件，或在此粘贴日志片段。请先删除密码、令牌和其他敏感信息。"
      placeholder: "请粘贴相关日志片段。提交 issue 后，可以在评论中附上日志文件。"
    validations:
      required: false

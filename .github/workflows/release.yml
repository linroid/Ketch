name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  KETCH_VERSION: ${{ github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  build-cli:
    name: CLI (${{ matrix.name }})
    needs: [build-web]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            runner: macos-14
            os: macos
            arch: arm64
            ext: tar.gz
          # Oracle GraalVM for JDK 21 stops at 21.0.9 on macOS Intel, which
          # cannot read the current reachability metadata; JDK 25 can.
          - name: macOS-x64
            runner: macos-15-intel
            os: macos
            arch: x64
            ext: tar.gz
            jdk: '25'
          - name: Linux-x64
            runner: ubuntu-latest
            os: linux
            arch: x64
            ext: tar.gz
          - name: Linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            ext: tar.gz
          - name: Windows-x64
            runner: windows-latest
            os: windows
            arch: x64
            ext: zip
    steps:
      - uses: actions/checkout@v6

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ matrix.jdk || '21' }}
          distribution: 'graalvm'

      - uses: gradle/actions/setup-gradle@v5

      # Download pre-built web assets from the build-web job so we
      # don't re-run wasmJsBrowserProductionWebpack inside nativeCompile.
      # This avoids yarn concurrency issues on Windows and speeds up
      # the CLI build on all platforms.
      - name: Download web distribution
        uses: actions/download-artifact@v8
        with:
          name: ketch-web
          path: ${{ runner.temp }}/ketch-web

      - name: Unpack web assets
        run: |
          mkdir -p cli/build/prebuilt-web
          unzip "$RUNNER_TEMP/ketch-web"/ketch-web-*.zip -d cli/build/prebuilt-web

      - name: Build native image
        run: >
          ./gradlew :cli:nativeCompile
          -PVERSION_NAME=${KETCH_VERSION#v}
          -PprebuiltWebDir=build/prebuilt-web
          -PnativeImageJdk=${{ matrix.jdk || '21' }}

      # UPX's default level: --best took 20-25 minutes per Linux binary, and the archive is
      # compressed again anyway.
      - name: Compress with UPX (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y upx-ucl
          upx cli/build/native/nativeCompile/ketch

      - name: Compress with UPX (Windows)
        if: matrix.os == 'windows'
        run: |
          choco install upx -y
          upx cli/build/native/nativeCompile/ketch.exe

      - name: Package (Unix)
        if: matrix.os != 'windows'
        run: |
          cd cli/build/native/nativeCompile
          tar -czf ketch-cli-${KETCH_VERSION#v}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz \
            ketch licenses

      - name: Package (Windows)
        if: matrix.os == 'windows'
        run: |
          cd cli/build/native/nativeCompile
          7z a ketch-cli-${KETCH_VERSION#v}-${{ matrix.os }}-${{ matrix.arch }}.zip \
            ketch.exe licenses

      - uses: actions/upload-artifact@v7
        with:
          name: ketch-cli-${{ matrix.os }}-${{ matrix.arch }}
          path: cli/build/native/nativeCompile/ketch-cli-*.${{ matrix.ext }}

  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_FILE: /tmp/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:android:assembleDirectRelease -PVERSION_NAME=${KETCH_VERSION#v} \
            -PversionCode=${{ github.run_number }}

      - name: Rename APK
        run: |
          APK=$(find app/android/build/outputs/apk/direct/release -name '*.apk' | head -1)
          cp "$APK" app/android/build/outputs/apk/direct/release/ketch-android-${KETCH_VERSION#v}.apk

      # R8 renames classes and methods, so stack traces from this APK can only be read with the
      # mapping of this exact build. The text file is >100 MB; zipped it is a few MB.
      - name: Package R8 mapping
        run: >
          zip -j -9
          app/android/build/outputs/apk/direct/release/ketch-android-${KETCH_VERSION#v}-mapping.zip
          app/android/build/outputs/mapping/directRelease/mapping.txt

      - uses: actions/upload-artifact@v7
        with:
          name: ketch-android
          path: |
            app/android/build/outputs/apk/direct/release/ketch-android-*.apk
            app/android/build/outputs/apk/direct/release/ketch-android-*-mapping.zip
          if-no-files-found: error

  build-desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            runner: macos-latest
            task: packageReleaseDmg
            os: macos
            arch: arm64
            ext: dmg
          - name: macOS-x64
            runner: macos-15-intel
            task: packageReleaseDmg
            os: macos
            arch: x64
            ext: dmg
          - name: Linux-x64
            runner: ubuntu-latest
            task: packageReleaseDeb
            os: linux
            arch: x64
            ext: deb
          - name: Linux-arm64
            runner: ubuntu-24.04-arm
            task: packageReleaseDeb
            os: linux
            arch: arm64
            ext: deb
          # Windows also ships the portable app, the app folder in a .zip.
          - name: Windows-x64
            runner: windows-latest
            task: packageReleaseMsi
            os: windows
            arch: x64
            ext: msi
            portable: true
          - name: Windows-arm64
            runner: windows-11-arm
            task: packageReleaseMsi
            os: windows
            arch: arm64
            ext: msi
            portable: true
    steps:
      - uses: actions/checkout@v6

      # The JDK the app bundles (desktopJavaHome below).
      - uses: actions/setup-java@v5
        id: jdk
        with:
          distribution: temurin
          java-version: 21

      # JDK-8371740, a LinkedTransferQueue race fixed only in JDK 26, makes Gradle on Windows ARM64
      # often fail once the build is done: a build event listener misses the end of its queue, and
      # Gradle gives up after 60 s with "Timeout waiting for concurrent jobs to complete". Gradle
      # runs on the JDK that launches it, so installing 21.0.1, the last build before the bug, last
      # makes it Gradle's JDK there; the app still bundles the Temurin JDK above.
      - uses: actions/setup-java@v5
        if: matrix.os == 'windows' && matrix.arch == 'arm64'
        with:
          distribution: microsoft
          java-version: 21.0.1

      - uses: gradle/actions/setup-gradle@v5

      - name: Build desktop package
        env:
          DESKTOP_JAVA_HOME: ${{ steps.jdk.outputs.path }}
        run: >
          ./gradlew :app:desktop:${{ matrix.task }}
          ${{ matrix.portable && ':app:desktop:packageReleasePortableZip' || '' }}
          -PVERSION_NAME=${KETCH_VERSION#v}
          "-PdesktopJavaHome=$DESKTOP_JAVA_HOME"

      # jpackage marks every MSI as x64, yet the ARM64 one carries jpackage's ARM64 custom action
      # DLL. Windows Installer runs it in an x64 host, which can't load it, so installing fails
      # with error 1723. Marking the package Arm64 (Windows Installer 5.0) runs it natively.
      - name: Mark the MSI as Arm64
        if: matrix.os == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem app/desktop/build/compose/binaries/main-release -Recurse -Filter *.msi).FullName
          function Call($target, $name, $flags, $arguments) {
            $target.GetType().InvokeMember($name, $flags, $null, $target, $arguments)
          }
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = Call $installer OpenDatabase InvokeMethod @($msi, 1) # msiOpenDatabaseModeTransact
          $summary = Call $database SummaryInformation GetProperty @(2)
          $template = Call $summary Property GetProperty @(7)
          if (-not $template.StartsWith('x64;')) { throw "Unexpected MSI platform: $template" }
          Call $summary Property SetProperty @(7, ($template -replace '^x64;', 'Arm64;'))
          Call $summary Property SetProperty @(14, 500) # Minimum installer version
          Call $summary Persist InvokeMethod @()
          Call $database Commit InvokeMethod @()
          [void][Runtime.InteropServices.Marshal]::ReleaseComObject($summary)
          [void][Runtime.InteropServices.Marshal]::ReleaseComObject($database)
          $saved = Call $installer OpenDatabase InvokeMethod @($msi, 0) # msiOpenDatabaseModeReadOnly
          $check = Call (Call $saved SummaryInformation GetProperty @(0)) Property GetProperty @(7)
          if (-not $check.StartsWith('Arm64;')) { throw "MSI platform is still $check" }
          Write-Output "$msi now targets $check"

      - name: Rename artifact
        run: |
          SRC=$(find app/desktop/build/compose/binaries/main-release -name "*.${{ matrix.ext }}")
          DEST="app/desktop/build/ketch-desktop-${KETCH_VERSION#v}-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.ext }}"
          if [ "${{ matrix.ext }}" = dmg ]; then
            # jpackage writes a zlib (UDZO) image; LZMA (ULMO, macOS 10.15+) is much smaller.
            hdiutil convert "$SRC" -format ULMO -o "$DEST"
          else
            cp "$SRC" "$DEST"
          fi
          # The in-app updater finds the portable app by this name (ReleaseProduct.PortableDesktop).
          if [ "${{ matrix.portable }}" = true ]; then
            cp app/desktop/build/compose/binaries/main-release/portable/Ketch-portable.zip \
              "app/desktop/build/ketch-desktop-${KETCH_VERSION#v}-${{ matrix.os }}-${{ matrix.arch }}-portable.zip"
          fi

      # ProGuard renames classes and methods, so stack traces from these packages can only be
      # read with the mapping of this exact build. jar writes the zip on every runner.
      - name: Package ProGuard mapping
        run: >
          jar --create --no-manifest
          --file "app/desktop/build/ketch-desktop-${KETCH_VERSION#v}-${{ matrix.os }}-${{ matrix.arch }}-mapping.zip"
          -C app/desktop/build/outputs/proguard mapping.txt

      - uses: actions/upload-artifact@v7
        with:
          name: ketch-desktop-${{ matrix.name }}
          path: |
            app/desktop/build/ketch-desktop-*.${{ matrix.ext }}
            app/desktop/build/ketch-desktop-*-portable.zip
            app/desktop/build/ketch-desktop-*-mapping.zip
          if-no-files-found: error

  build-web:
    name: Web (WasmJs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Build web distribution
        run: ./gradlew :app:web:wasmJsBrowserDistribution -PVERSION_NAME=${KETCH_VERSION#v}

      - name: Package web distribution
        run: |
          cd app/web/build/dist/wasmJs/productionExecutable
          zip -r /tmp/ketch-web-${KETCH_VERSION#v}.zip .

      - uses: actions/upload-artifact@v7
        with:
          name: ketch-web
          path: /tmp/ketch-web-*.zip

  build-extension:
    name: Browser extension
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: app/browser-extension
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run unit tests
        run: node --test

      # Manifests only take numeric versions: the run number keeps each release newer than the
      # last one, and Chromium displays the tag's version.
      # Includes chrome-store.zip without the development key for store submissions.
      - name: Build browser extension packages
        run: node build.mjs --version "${KETCH_VERSION#v}" --build "${{ github.run_number }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ketch-extension
          path: app/browser-extension/build/ketch-extension-*.zip
          if-no-files-found: error

  publish-maven-central:
    name: Publish to Maven Central
    needs: [build-cli, build-android, build-desktop, build-web]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Publish to Maven Central
        run: >
          ./gradlew publishAndReleaseToMavenCentral
          -PVERSION_NAME=${KETCH_VERSION#v}
          --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-cli, build-android, build-desktop, build-web, build-extension, publish-maven-central]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Generate download list
        run: |
          python3 .github/scripts/release-notes.py \
            --artifacts artifacts \
            --server-url "$GITHUB_SERVER_URL" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$KETCH_VERSION" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: artifacts/**

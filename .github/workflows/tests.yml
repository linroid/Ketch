name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, "codex/torrent-*" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  jvm-tests:
    name: JVM Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Install independent torrent client
        run: sudo apt-get update && sudo apt-get install -y transmission-daemon

      - name: Run JVM tests
        env:
          TRANSMISSION_DAEMON: /usr/bin/transmission-daemon
        run: ./gradlew jvmTest :library:torrent:verifyNoNativeTorrentRuntime

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-jvm
          path: '**/build/test-results/**/TEST-*.xml'

  android-tests:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest :library:torrent:testAndroidHostTest :library:core:testAndroidHostTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-android
          path: '**/build/test-results/**/TEST-*.xml'

  ios-tests:
    name: iOS Tests
    # Use macos-26 for Xcode 26 (default 26.2) which ships the iOS 26 SDK.
    # Compose Multiplatform 1.11+ references iOS 26 APIs (UIViewLayoutRegion)
    # that are not present in the iOS 18 SDK bundled with Xcode 16.x.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Run iOS simulator tests
        run: ./gradlew iosSimulatorArm64Test -PenableIosSimulatorTests=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ios
          path: '**/build/test-results/**/TEST-*.xml'

  js-tests:
    name: JS Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Run JS tests
        run: ./gradlew jsNodeTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-js
          path: '**/build/test-results/**/TEST-*.xml'

  torrent-desktop-tests:
    name: Torrent filesystem (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Run torrent tests on the host filesystem
        run: ./gradlew :library:torrent:jvmTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-torrent-${{ matrix.os }}
          path: '**/build/test-results/**/TEST-*.xml'

  torrent-device-tests:
    name: Torrent Android device tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: ./gradlew :library:torrent:connectedAndroidDeviceTest
      - name: Require an executed device test
        run: |
          python3 - <<'PYTEST'
          import pathlib, xml.etree.ElementTree as ET
          reports = pathlib.Path('library/torrent/build/outputs/androidTest-results').rglob('TEST-*.xml')
          count = sum(int(ET.parse(p).getroot().get('tests', 0)) for p in reports)
          assert count > 0, 'No instrumented tests executed'
          PYTEST
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-torrent-device
          path: library/torrent/build/outputs/androidTest-results/**/TEST-*.xml

  publish-results:
    name: Publish Test Results
    runs-on: ubuntu-latest
    needs: [ jvm-tests, android-tests, ios-tests, js-tests, torrent-desktop-tests, torrent-device-tests ]
    if: always()
    steps:
      - name: Download test results
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          merge-multiple: true

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: '**/TEST-*.xml'

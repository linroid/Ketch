name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, "codex/torrent-*", "torrent-v2-*" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  jvm-tests:
    name: JVM Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Install fixture build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev libssl-dev

      - name: Cache pinned Transmission fixture
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ketch-transmission
          key: transmission-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('test-fixtures/torrent/clients.properties', 'tools/torrent/build_transmission.py') }}

      - name: Build authenticated independent torrent client
        run: python3 tools/torrent/build_transmission.py --output "$RUNNER_TEMP/ketch-transmission"

      - name: Verify conformance gate behavior
        run: python3 -m unittest discover -s tools/torrent -p 'test_*.py'

      # allJvmTests also runs `test` in the JVM-only modules. The CLI tests do not read the web app
      # the CLI bundles, so a prebuiltWebDir that does not exist skips its wasm build.
      - name: Run JVM tests
        env:
          TRANSMISSION_DAEMON: ${{ runner.temp }}/ketch-transmission/build/daemon/transmission-daemon
        run: |
          ./gradlew allJvmTests :library:torrent:verifyNoNativeTorrentRuntime \
            -PtorrentConformance=true -PprebuiltWebDir=build/no-web-app

      - name: Compile publication metadata
        run: ./gradlew compileCommonMainKotlinMetadata

      - name: Require executed interoperability scenarios
        run: |
          python3 tools/torrent/verify_conformance.py \
            --reports library/torrent/build/test-results/jvmTest \
            --revision "$GITHUB_SHA" \
            --output library/torrent/build/reports/conformance/executed.json

      - name: Upload conformance evidence
        uses: actions/upload-artifact@v7
        with:
          name: torrent-conformance
          path: library/torrent/build/reports/conformance/executed.json
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-jvm-attempt-${{ github.run_attempt }}
          path: '**/build/test-results/**/TEST-*.xml'

  android-tests:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest :library:torrent:testAndroidHostTest :library:core:testAndroidHostTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-android-attempt-${{ github.run_attempt }}
          path: '**/build/test-results/**/TEST-*.xml'

  ios-tests:
    name: iOS Tests
    # Use macos-26 for Xcode 26 (default 26.2) which ships the iOS 26 SDK.
    # Compose Multiplatform 1.11+ references iOS 26 APIs (UIViewLayoutRegion)
    # that are not present in the iOS 18 SDK bundled with Xcode 16.x.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Run iOS simulator tests
        run: ./gradlew iosSimulatorArm64Test -PenableIosSimulatorTests=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ios-attempt-${{ github.run_attempt }}
          path: '**/build/test-results/**/TEST-*.xml'

  js-tests:
    name: JS Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Run JS tests
        run: ./gradlew jsNodeTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-js-attempt-${{ github.run_attempt }}
          path: '**/build/test-results/**/TEST-*.xml'

  extension-tests:
    name: Browser Extension Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/browser-extension
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run unit tests
        run: |
          mkdir -p build/test-results
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=build/test-results/TEST-browser-extension.xml

      - name: Build Chromium and Firefox packages
        run: node build.mjs

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: browser-extension
          path: app/browser-extension/build/*.zip
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-extension-attempt-${{ github.run_attempt }}
          path: app/browser-extension/build/test-results/TEST-*.xml

  torrent-desktop-tests:
    name: Torrent filesystem (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Run torrent tests on the host filesystem
        run: ./gradlew :library:torrent:jvmTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-torrent-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: '**/build/test-results/**/TEST-*.xml'

  desktop-windows-tests:
    name: Desktop update scripts (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      # The portable app's PowerShell update script only runs on Windows, so its tests skip
      # elsewhere.
      - name: Run the portable app's update script tests
        run: ./gradlew :app:desktop:test --tests '*WindowsPortableScriptTest*'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-desktop-windows-attempt-${{ github.run_attempt }}
          path: app/desktop/build/test-results/**/TEST-*.xml

  torrent-device-tests:
    name: Torrent Android device tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: ./gradlew :library:torrent:connectedAndroidDeviceTest
      - name: Require an executed device test
        run: |
          python3 - <<'PYTEST'
          import pathlib, xml.etree.ElementTree as ET
          reports = pathlib.Path('library/torrent/build/outputs/androidTest-results').rglob('TEST-*.xml')
          count = sum(int(ET.parse(p).getroot().get('tests', 0)) for p in reports)
          assert count > 0, 'No instrumented tests executed'
          PYTEST
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-torrent-device-attempt-${{ github.run_attempt }}
          path: library/torrent/build/outputs/androidTest-results/**/TEST-*.xml

  required-checks:
    name: Required Checks
    runs-on: ubuntu-24.04
    needs: [ jvm-tests, android-tests, ios-tests, js-tests, extension-tests, torrent-desktop-tests, desktop-windows-tests, torrent-device-tests, publish-results ]
    if: always()
    steps:
      - name: Require every test job to succeed on this revision
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['JOB_RESULTS'])
          failed = {name: value['result'] for name, value in results.items()
                    if value['result'] != 'success'}
          assert results and not failed, f'Required checks did not pass: {failed}'
          PY

  publish-results:
    name: Publish Test Results
    runs-on: ubuntu-latest
    needs: [ jvm-tests, android-tests, ios-tests, js-tests, extension-tests, torrent-desktop-tests, desktop-windows-tests, torrent-device-tests ]
    if: always()
    steps:
      - name: Download test results
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: test-results
          # Host jobs use identical report paths. Keep each artifact in its own directory.
          merge-multiple: false

      # Re-running failed jobs keeps the earlier attempt's artifacts, and download-artifact picks
      # between same-named artifacts by ID, which does not follow upload order. Artifact names
      # carry the run attempt instead, and only the newest attempt of each job is published.
      - name: Keep the latest attempt of each job's results
        run: |
          python3 - <<'PY'
          import pathlib, re, shutil
          latest = {}
          for directory in sorted(pathlib.Path('test-results').iterdir()):
              match = re.fullmatch(r'(.+)-attempt-(\d+)', directory.name)
              assert match, f'Artifact name without a run attempt: {directory.name}'
              job, attempt = match[1], int(match[2])
              previous = latest.get(job)
              if previous and previous[0] > attempt:
                  stale = directory
              else:
                  stale = previous and previous[1]
                  latest[job] = (attempt, directory)
              if stale:
                  print(f'Skipping superseded results: {stale.name}')
                  shutil.rmtree(stale)
          for job, (attempt, directory) in sorted(latest.items()):
              print(f'Publishing {job} from attempt {attempt}')
          PY

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: 'test-results/**/TEST-*.xml'
          action_fail: true
          action_fail_on_inconclusive: true

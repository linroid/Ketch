<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0"
          name="viewport">
    <title>Ketch Web - Download Manager</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --canvas: #EEF1F8;
            --accent: #4F5DE4;
            --track: rgba(102, 112, 128, 0.12);
            --hull: rgba(102, 112, 128, 0.2);
            color-scheme: light dark;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --canvas: #0C0E13;
                --accent: #5563F0;
                --track: rgba(133, 141, 156, 0.12);
                --hull: rgba(133, 141, 156, 0.2);
            }
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--canvas);
        }
        /* Sail lanes shown until the app's fonts have loaded; main.kt removes it. */
        #splash {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--canvas);
        }
        #splash svg {
            width: min(280px, 56vw);
            height: auto;
        }
        #splash .track {
            fill: var(--track);
        }
        #splash .hull {
            fill: var(--hull);
        }
        #splash .fill {
            fill: var(--accent);
            transform-box: fill-box;
            transform-origin: 0 50%;
            transform: scaleX(0);
            animation: lane-fill 5s cubic-bezier(0.2, 0, 0, 1) infinite both;
            animation-delay: calc(var(--i) * 90ms);
        }
        #splash .fill.ember {
            fill: url(#ember);
        }
        #splash .glow-accent {
            stop-color: var(--accent);
            stop-opacity: 0.12;
        }
        #splash .glow-ember {
            stop-color: #E0482B;
            stop-opacity: 0.06;
        }
        #splash .glow-end {
            stop-color: #E0482B;
            stop-opacity: 0;
        }
        /* Fill for 1.8 s, hold for 2 s, then clear and start again. */
        @keyframes lane-fill {
            0% { transform: scaleX(0); opacity: 1; }
            36% { transform: scaleX(1); opacity: 1; }
            76% { transform: scaleX(1); opacity: 1; }
            90% { transform: scaleX(1); opacity: 0; }
            100% { transform: scaleX(0); opacity: 0; }
        }
        @media (prefers-reduced-motion: reduce) {
            #splash .fill {
                animation: none;
                transform: none;
            }
        }
    </style>
</head>

</div>
<script src="ketch-web.js"></script>
</body>
</html>
